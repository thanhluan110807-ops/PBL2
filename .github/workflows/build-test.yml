name: Build and test

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.build_type }} / sanitizer ${{ matrix.sanitizers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "OFF"
          - build_type: Release
            sanitizers: "OFF"
          - build_type: Debug
            sanitizers: "ON"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DPBL2_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Check project source policy
        run: cmake --build build --target check_project_sources
      - name: Build core, tests and standalone headers
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
